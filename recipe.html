<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe · AI Cookbook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍🍳</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen">
  <a href="#main" class="sr-only-focusable fixed top-2 left-2 z-50 bg-indigo-600 text-white px-3 py-2 rounded-lg">Skip to content</a>

  <header class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold text-lg tracking-tight">
        <span class="text-2xl">🧑‍🍳</span>
        <span>AI <span class="text-indigo-600 dark:text-indigo-400">Cookbook</span></span>
      </a>
      <div class="flex items-center gap-2">
        <a href="index.html" class="text-sm font-medium px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">← All recipes</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" class="w-10 h-10 flex items-center justify-center rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-lg">
          <span id="theme-toggle-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="max-w-4xl mx-auto px-4 sm:px-6 py-10">
    <div id="recipe-root"></div>
    <div id="not-found" class="hidden text-center py-24">
      <p class="text-5xl mb-4">🤷</p>
      <h1 class="text-2xl font-bold mb-2">Recipe not found</h1>
      <p class="text-slate-600 dark:text-slate-400 mb-6">This recipe doesn't exist or couldn't be loaded.</p>
      <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium px-4 py-2.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">← Back to all recipes</a>
    </div>
  </main>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-8">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-sm text-slate-500 dark:text-slate-400 text-center">
      AI Cookbook — a static, human-in-the-loop prompt recipe hub.
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/recipe.js"></script>
</body>
</html>
